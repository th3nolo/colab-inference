[project]
name = "colab-inference-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transformers==5.16.1",
  "accelerate==1.15.0",
  "fastapi==0.141.1",
  "uvicorn==0.40.0",
  "starlette==1.3.1",
  "torch==2.13.0+cu126",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
